<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juno Birthday Date Night 💌</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: #fff7fb;
    text-align: center;
    color: #333;
    overflow-x: hidden;
}

/* HEARTS */
.heart {
    position: fixed;
    top: -10px;
    color: #ff6fae;
    font-size: 18px;
    animation: fall linear forwards;
    opacity: 0.7;
}

@keyframes fall {
    to { transform: translateY(110vh); }
}

/* PAGES */
.page {
    display: none;
    padding: 50px 20px;
    max-width: 900px;
    margin: auto;
}

.page.active {
    display: block;
}

/* CARD */
.card {
    background: white;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* BUTTONS */
.btn {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 12px auto;
    padding: 16px;
    border-radius: 18px;
    border: 2px solid #d46a9a;
    background: white;
    color: #d46a9a;
    cursor: pointer;
}

.btn:hover {
    background: #d46a9a;
    color: white;
}

/* TICKET */
.ticket {
    border: 2px dashed #d46a9a;
    padding: 20px;
    border-radius: 15px;
    margin-top: 15px;
}

/* TYPE */
#typeText {
    min-height: 80px;
}

/* GALLERY */
.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.gallery img {
    width: 100%;
    border-radius: 12px;
}
</style>
</head>

<body>

<!-- 🎀 HEARTS -->
<script>
function hearts(){
    const h = document.createElement("div");
    h.classList.add("heart");
    h.innerHTML = "💖";
    h.style.left = Math.random()*100+"vw";
    h.style.animationDuration = (2+Math.random()*3)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),5000);
}
setInterval(hearts,300);
</script>

<!-- PAGE 1 -->
<div id="page1" class="page active">
    <div class="card">

        <h1>💌 A Special Invitation</h1>

        <p>
            Hey Daddy…<br><br>
            June 6, 2026 💖<br>
            I made something for your special day.
        </p>

        <button class="btn" onclick="start()">💌 I accept the invitation</button>

        <button class="btn" onclick="playMusic()">🎵 Play our music</button>

    </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
    <div class="card">

        <h1>💖 Message</h1>

        <p id="typeText"></p>

        <button class="btn" onclick="go('page3')">Continue</button>

    </div>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
    <div class="card">

        <h1>🍽️ Choose your food</h1>

        <button class="btn" onclick="choose('Ramen')">🍜 Ramen</button>
        <button class="btn" onclick="choose('Burgers')">🍔 Burgers</button>
        <button class="btn" onclick="choose('Chicken')">🍗 Chicken</button>
        <button class="btn" onclick="choose('Pork')">🐷 Pork</button>
        <button class="btn" onclick="choose('Beef')">🥩 Beef</button>

    </div>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
    <div class="card">

        <h1>🎟️ Birthday Ticket</h1>

        <div class="ticket">
            <p><b>Name:</b> Juno</p>
            <p><b>Date:</b> June 6, 2026</p>
            <p><b>Time:</b> 8:00 PM</p>
            <p><b>Dress Code:</b> pogi</p>
        </div>

        <button class="btn" onclick="go('page5')">Final Surprise</button>

    </div>
</div>

<!-- PAGE 5 -->
<div id="page5" class="page">
    <div class="card">

        <h1>💌 Ending</h1>

        <p>
            I can’t wait to see you, daddy 💖<br><br>
            I love you so much.<br>
            Ang galing-galing mo 😌
        </p>

        <div class="gallery">
            <img src="207300e0-a7eb-4654-aa1d-e7513e7191a9.jpg">
            <img src="image_2026-05-28_044953987.png">
            <img src="image_2026-05-28_045303775.png">
            <img src="image_2026-05-28_045322390.png">
        </div>

    </div>
</div>

<script>

/* PAGE SWITCH */
function go(page){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(page).classList.add('active');
}

/* MUSIC */
function playMusic(){
    window.open("https://open.spotify.com/track/77uHMAuHcP2VKDvF9LXtGt?si=aa805888be4c4958","_blank");
}

/* START + TYPE */
function start(){
    go('page2');

    const text =
`You said yes 😌

I love you daddy 💖
I can’t wait to see you on your 32nd birthday.

I’m really happy I get to spend this birthday with you.
I hope you feel loved, relaxed, and special.`;

    let i = 0;
    document.getElementById("typeText").innerHTML = "";

    function typing(){
        if(i < text.length){
            document.getElementById("typeText").innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, 30);
        }
    }
    typing();
}

/* FOOD */
function choose(food){
    alert("You chose " + food + " 💖");
    go('page4');
}

</script>

</body>
</html>
