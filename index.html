<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juno Birthday Date 💌</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: #fff7fb;
    text-align: center;
    color: #333;
}

/* PAGES */
.page {
    display: none;
    padding: 50px 20px;
    max-width: 900px;
    margin: auto;
}

.page.active {
    display: block;
}

/* CARD */
.card {
    background: white;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* TEXT */
h1 {
    color: #d46a9a;
}

p {
    font-size: 16px;
    line-height: 1.6;
}

/* BUTTONS */
.btn {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 12px auto;
    padding: 16px;
    font-size: 17px;
    border-radius: 18px;
    border: 2px solid #d46a9a;
    background: white;
    color: #d46a9a;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #d46a9a;
    color: white;
}

.accept {
    background: #d46a9a;
    color: white;
}

/* GALLERY */
.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 20px;
}

.gallery img {
    width: 100%;
    border-radius: 12px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
    <div class="card">

        <h1>💌 A Special Invitation</h1>

        <p>
            Hey Juno…<br><br>
            June 6, 2026 💖<br>
            I made something for our 8PM date.
        </p>

        <button class="btn accept" onclick="acceptInvite()">💌 I accept the invitation</button>

        <!-- 🎵 MUSIC BUTTON (FIRST PAGE) -->
        <button class="btn" onclick="playMusic()">🎵 Play our music</button>

    </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
    <div class="card">

        <h1>💖 Message for you</h1>

        <p>
            You said yes 😌<br><br>
            I’m really happy, daddy.<br>
            I can’t wait to see you.<br><br>
            Now choose your food 🍽️
        </p>

        <button class="btn" onclick="goTo('page3')">Continue</button>

    </div>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
    <div class="card">

        <h1>🍽️ Choose your food</h1>

        <button class="btn" onclick="choose('Ramen')">🍜 Ramen</button>
        <button class="btn" onclick="choose('Burgers')">🍔 Burgers</button>
        <button class="btn" onclick="choose('Chicken')">🍗 Chicken</button>
        <button class="btn" onclick="choose('Pork')">🐷 Pork</button>
        <button class="btn" onclick="choose('Beef')">🥩 Beef</button>

    </div>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
    <div class="card">

        <h1>📸 Memory Gallery</h1>

        <div class="gallery">
            <img src="207300e0-a7eb-4654-aa1d-e7513e7191a9.jpg">
            <img src="image_2026-05-28_044953987.png">
            <img src="image_2026-05-28_045303775.png">
            <img src="image_2026-05-28_045322390.png">
            <img src="image_2026-05-28_045328572.png">
        </div>

    </div>
</div>

<script>

function acceptInvite() {
    goTo('page2');
}

/* 🎵 MUSIC BUTTON */
function playMusic() {
    window.open("https://open.spotify.com/track/77uHMAuHcP2VKDvF9LXtGt?si=aa805888be4c4958", "_blank");
}

function goTo(page) {
    let pages = document.querySelectorAll('.page');
    pages.forEach(p => p.classList.remove('active'));

    setTimeout(() => {
        document.getElementById(page).classList.add('active');
    }, 200);
}

function choose(food) {
    alert("You chose " + food + " 💖");

    goTo("page4");
}

</script>

</body>
</html>
