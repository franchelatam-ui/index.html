<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juno Date Sim 💌</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: #fff7fb;
    text-align: center;
    color: #333;
    overflow-x: hidden;
}

/* HEARTS */
.heart {
    position: fixed;
    top: -10px;
    color: #ff6fae;
    font-size: 20px;
    animation: fall linear forwards;
    opacity: 0.7;
}

@keyframes fall {
    to {
        transform: translateY(110vh);
    }
}

/* PAGES */
.page {
    display: none;
    padding: 50px 20px;
    max-width: 900px;
    margin: auto;
}

.page.active {
    display: block;
}

/* CARD */
.card {
    background: white;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* BUTTONS */
.btn {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 12px auto;
    padding: 16px;
    border-radius: 18px;
    border: 2px solid #d46a9a;
    background: white;
    color: #d46a9a;
    cursor: pointer;
}

.btn:hover {
    background: #d46a9a;
    color: white;
}

/* TICKET */
.ticket {
    border: 2px dashed #d46a9a;
    padding: 20px;
    border-radius: 15px;
    margin-top: 15px;
    animation: pop 0.6s ease;
}

@keyframes pop {
    from {transform: scale(0.8); opacity: 0;}
    to {transform: scale(1); opacity: 1;}
}

/* TYPE TEXT */
#typeText {
    min-height: 60px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
    <div class="card">

        <h1>💌 A Special Invitation</h1>

        <p>
            Hey Daddy…<br>
            June 6, 2026 💖
        </p>

        <button class="btn" onclick="startTyping()">💌 I accept the invitation</button>
    </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
    <div class="card">

        <h1>💖 Message</h1>

        <p id="typeText"></p>

        <button class="btn" onclick="goTo('page3')">Continue</button>
    </div>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
    <div class="card">

        <h1>🎟️ Birthday Ticket</h1>

        <div class="ticket">
            <p><b>Name:</b> Juno</p>
            <p><b>Date:</b> June 6, 2026</p>
            <p><b>Time:</b> 8:00 PM</p>
            <p><b>Dress Code:</b> pogi</p>
        </div>

        <button class="btn" onclick="goTo('page4')">Final Surprise</button>

    </div>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
    <div class="card">

        <h1>💌 Ending</h1>

        <p>
            I can’t wait to see you, daddy 💖<br><br>
            I love you so much.<br>
            Ang galing-galing mo 😌
        </p>

    </div>
</div>

<script>

/* 🎀 HEARTS */
function hearts() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (2 + Math.random() * 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}
setInterval(hearts, 300);

/* 💌 PAGE SWITCH */
function goTo(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(page).classList.add('active');
}

/* ✍️ TYPE MESSAGE */
function startTyping() {
    goTo('page2');

    const text = "I’m really happy I get to spend this birthday with you daddy 💖 I hope you feel loved, relaxed, and special. I can’t wait for 8PM with you.";
    
    let i = 0;
    let speed = 40;

    function type() {
        if (i < text.length) {
            document.getElementById("typeText").innerHTML += text.charAt(i);
            i++;
            setTimeout(type, speed);
        }
    }

    document.getElementById("typeText").innerHTML = "";
    type();
}

</script>

</body>
</html>
